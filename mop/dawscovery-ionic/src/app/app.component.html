<ion-app>
  <ion-split-pane contentId="main-content">

    <ion-menu side="start" menuId="main-menu" contentId="main-content">

      <ion-header [translucent]="true">
        <ion-toolbar>
          <ion-title>dawscovery +</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-list>
          <ion-menu-toggle autoHide="false">
            <ion-item routerLink="/home" routerDirection="root" detail="false">
              <ion-icon name="home-outline" slot="start"></ion-icon>
              <ion-label>Home</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle autoHide="false">
            <ion-item routerLink="/lists" detail="false">
              <ion-icon name="list-outline" slot="start"></ion-icon>
              <ion-label>Lists</ion-label>
            </ion-item>
          </ion-menu-toggle>

        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content" main></ion-router-outlet>

  </ion-split-pane>
</ion-app>

<ion-app>
  @if (logged()) {
  <ion-menu side="start" contentId="main-content">
    <ion-header [translucent]="true">
      <ion-toolbar>
        <ion-title>dawscovery +</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ion-list>
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/home" routerDirection="root">
            <ion-label>Inici</ion-label>
          </ion-item>
          <ion-item routerLink="/posts" routerDirection="root">
            <ion-label>Posts</ion-label>
          </ion-item>
          <ion-item routerLink="/connections" routerDirection="root">
            <ion-label>Conexions</ion-label>
          </ion-item>

          <ion-item>
            <ion-button (click)="logout()">Tancar sessió</ion-button>
          </ion-item>

        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
  }

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>

<ion-content>
  <ion-header>
    <ion-toolbar>
      <ion-title>Benvingut a Dawscovery</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Connecta</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Connecta amb gent real que coneixes i no bots.
    </ion-card-content>
  </ion-card>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Comparteix</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Comparteix les zones que has descobert amb les teves connexions.
    </ion-card-content>
  </ion-card>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Descobreix</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Descobreix les noves rutes, ubicacoins, i llocs que segurament no has visitat.
    </ion-card-content>
  </ion-card>
  <ion-button (click)="register()" expand="block">Registrar-se</ion-button>
  <ion-button (click)="login()" expand="block">Iniciar sessió</ion-button>

</ion-content>

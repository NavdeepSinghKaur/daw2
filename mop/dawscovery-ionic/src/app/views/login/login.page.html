<ion-content>
  <ion-list>
    <ion-item>
      <ion-input label="Usuari" [(ngModel)]="username"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input type="password" label="Contrasenya" [(ngModel)]="password"></ion-input>
    </ion-item>
    <ion-button [disabled]="false" (click)="login()">Entrar</ion-button>
    <p>no tens un compte? <a routerLink="/register">Registra't</a></p>

    <ion-text>O també pots iniciar sesió amb: </ion-text>
    <ion-button (click)="loginGoogle()">Google</ion-button>
  </ion-list>
</ion-content>

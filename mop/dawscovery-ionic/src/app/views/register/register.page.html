<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Crear compte</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-input type="text" label="Usuari" value="" [(ngModel)]="username"></ion-input>
      <ion-input type="password" [(ngModel)]="password" label="Contrasenya" value="">
        <ion-input-password-toggle></ion-input-password-toggle>
      </ion-input>
      <ion-button [disabled]="false" (click)="register()">
        Registrar-se
      </ion-button>
      <p>Ja tens compte? <a routerLink="/login">Inicia sessió</a></p>
    </ion-card-content>

  </ion-card>
</ion-content>

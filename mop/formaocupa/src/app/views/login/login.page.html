<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Iniciar sessió</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-input label="Usuari"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Contrasenya" type="password"></ion-input>
        </ion-item>

        <ion-button (click)="login()">
          Entrar
        </ion-button>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
